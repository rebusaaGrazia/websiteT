<!DOCTYPE html>
<html lang="it">

<head>

    <title>Graziella Trullo</title>
    <script>
        var routes = {
            '/websiteT/chi-siamo': '/websiteT/chiSiamo',
            '/websiteT/galleria': '/websiteT/galleria',
            '/websiteT/mappa': '/websiteT/map',
            '/websiteT/contatti': '/websiteT/contatti',

            '/websiteT/home': '/websiteT/main',
            '/websiteT/': '/websiteT/main',
            '/websiteT': '/websiteT/main'
        };
        var path = window.location.pathname.replace(/\/$/, '') || '/';
        var target = routes[path] || '/websiteT/main';
        window.location.replace(target);
    </script>
